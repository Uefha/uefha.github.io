<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef2f4">
  <title>CV — Muhammad Nur Fadila</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eef2f4}
    .cv-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef2f4}
    .download-link{position:fixed;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  </style>
</head>
<body>
  <iframe class="cv-frame" src="assets/cv/cv.pdf#toolbar=0&amp;view=FitH" title="Curriculum Vitae Muhammad Nur Fadila"></iframe>
  <a class="download-link" id="cv-download" href="assets/cv/cv.pdf" download="Muhammad-Nur-Fadila-CV.pdf">Unduh CV</a>
  <script>
    const downloadLink = document.querySelector('#cv-download');
    const viewingDuration = 10000;
    let viewedMilliseconds = 0;
    let visibleSince = 0;
    let downloadTimer;
    let downloadTriggered = false;

    function startViewingTimer() {
      if (document.hidden || downloadTimer || downloadTriggered) return;
      visibleSince = Date.now();
      downloadTimer = window.setTimeout(() => {
        downloadTriggered = true;
        downloadLink.click();
        downloadTimer = undefined;
      }, Math.max(0, viewingDuration - viewedMilliseconds));
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (downloadTimer) {
          window.clearTimeout(downloadTimer);
          downloadTimer = undefined;
          viewedMilliseconds += Date.now() - visibleSince;
        }
      } else {
        startViewingTimer();
      }
    });

    startViewingTimer();
  </script>
</body>
</html>
